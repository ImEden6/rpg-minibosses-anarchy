plugins {
	id 'fabric-loom' version '1.13-SNAPSHOT'
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url 'https://jitpack.io' }
	maven { url 'https://maven.shedaniel.me/' }
	maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
	maven { url 'https://maven.terraformersmc.com/' }
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {url 'https://maven.azuredoom.com/mods'}
	maven { url 'https://maven.kosmx.dev/' }
	maven { url 'https://maven.shedaniel.me/' }
	maven { url 'https://jitpack.io' }
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	runs {
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
	}
	mods {
		"rpg-minibosses" {
			sourceSet sourceSets.main
		}
		"rpg-minibosses-gametest" {
			sourceSet sourceSets.gametest
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "mod.azure.azurelib:azurelib-fabric-1.20.1:1.0.29"

	modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-fabric")
	modImplementation("maven.modrinth:runes:${project.runes_version}-fabric")
	// Uncomment the following line to enable the deprecated Fabric API modules.
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.
	modImplementation("dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}")
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}")
	modImplementation("maven.modrinth:extra-rpg-attributes:${project.extra_rpg_attributes_version}")

	implementation("com.github.LlamaLad7:MixinExtras:${project.mixin_extras_version}")
	modImplementation("dev.emi:trinkets:${project.trinkets_version}")

	modImplementation("maven.modrinth:simply-swords:${project.simply_swords_version}")
	modImplementation("maven.modrinth:architectury-api:${project.architectury_version}")
	modImplementation("maven.modrinth:fzzy-config:${project.fzzy_config_version}")
	modImplementation("maven.modrinth:simply-tooltips:${project.simply_tooltips_version}")
	modRuntimeOnly("net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}")
	modRuntimeOnly("com.github.ZsoltMolnarrr:TinyConfig:${project.tiny_config_version}")
	runtimeOnly("net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7")
	modRuntimeOnly("me.lucko:fabric-permissions-api:0.3.1")
	runtimeOnly("blue.endless:jankson:1.2.3")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def releaseVersion = mod_version.split('\\+')[0]
def releaseMinecraft = minecraft_version
def releaseNotes = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
	def section = text.replace('\r\n', '\n') =~ /(?ms)^## \[${java.util.regex.Pattern.quote(releaseVersion)}\][^\n]*\n(.*?)(?=^## \[|\z)/
	if (!section.find())
		throw new GradleException("CHANGELOG.md has no section for ${releaseVersion}")
	section.group(1).trim()
}

def modrinthId = modrinth_project_id.trim()
def curseforgeId = curseforge_project_id.trim()
def toModrinth = !modrinthId.isEmpty()
def toCurseforge = !curseforgeId.isEmpty()
def modrinthRequires = ['fabric-api', 'spell-engine', 'extra-rpg-attributes', 'azurelib', 'simply-swords']
def curseforgeRequires = ['fabric-api', 'spell-engine', 'extra-spell-attributes', 'azurelib', 'simply-swords']

publishMods {
	file = remapJar.archiveFile
	changelog = releaseNotes
	type = STABLE
	displayName = "ANARCHY RPG Minibosses ${releaseVersion} (Fabric ${releaseMinecraft})"
	modLoaders.add('fabric')
	// without every token it only writes what it would upload to build/publishMods
	dryRun = (toModrinth && providers.environmentVariable('MODRINTH_TOKEN').getOrNull() == null)
			|| (toCurseforge && providers.environmentVariable('CURSEFORGE_TOKEN').getOrNull() == null)

	if (toModrinth) {
		modrinth {
			projectId = modrinthId
			accessToken = providers.environmentVariable('MODRINTH_TOKEN')
			minecraftVersions.add(releaseMinecraft)
			requires(*modrinthRequires)
		}
	}

	if (toCurseforge) {
		curseforge {
			projectId = curseforgeId
			accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
			minecraftVersions.add(releaseMinecraft)
			javaVersions.add(JavaVersion.VERSION_17)
			client = true
			server = true
			requires(*curseforgeRequires)
		}
	}
}
